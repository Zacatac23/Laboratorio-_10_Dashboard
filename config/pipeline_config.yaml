# ==============================================================================
# Configuración del Pipeline MLOps - Observatorio de Inteligencia Turística
# Laboratorio 11: Flujo reproducible, gobernanza y publicación controlada
# ==============================================================================

pipeline:
  name: "observatorio_turismo_pipeline"
  destination: "Guatemala"
  random_seed: 42
  version: "1.0.0"

paths:
  raw_data_dir: "data"
  series_file: "series_mensuales.csv"
  pais_file: "pais_mensual.csv"
  via_frontera_file: "via_frontera.csv"
  historical_forecasts_file: "pronosticos.csv"
  output_dir: "data"               # destino de estimaciones_aprobadas.csv y su manifiesto
  approved_file: "estimaciones_aprobadas.csv"
  backup_dir: "data/backup_aprobadas"
  reports_dir: "reports"
  logs_dir: "logs"
  publish_lock_file: "logs/publish.lock"

scope:
  target_variable: "viajeros"
  target_series: "Total"
  secondary_series:
    - "Via_Aérea"
    - "Via_Terrestre"
    - "Via_Marítima"
    - "Tipo_Turista"
    - "Tipo_Excursionista"
    - "Tipo_Cruceristas"
    - "Tipo_Viajero"
  unit_of_measure: "viajeros/mes"
  aggregation_level: "mensual"
  date_column: "fecha"
  # pais_mensual y via_frontera: solo contexto/tablero; no alimentan el modelado

temporal_split:
  train_start: "2009-01-01"
  train_end: "2021-03-01"
  eval_start: "2021-04-01"
  eval_end: "2026-06-01"
  # Backtest de origen fijo: se entrena hasta train_end y se estiman meses posteriores.
  # No es evaluación de un paso; el horizonte es largo (hasta eval_end).
  evaluation_mode: "fixed_origin_backtest"
  # Meses con observación comparable se evalúan. Lista vacía a propósito:
  # ene/feb 2026 tienen dato observado y no se excluyen automáticamente.
  # Si la institución exige exclusión metodológica, agregar aquí con motivo.
  excluded_evaluation_periods: []
  # Ejemplo (desactivado):
  # excluded_evaluation_periods:
  #   - start: "2026-01-01"
  #     end: "2026-02-01"
  #     reason: "Limitación metodológica institucional declarada; no usar sin evidencia"

repartition_factors:
  method: "historical_mean_share"
  calculation_period: "train"
  description: "Proporción histórica de cada serie respecto al Total, solo en Train"
  group_tolerance: 0.05

models:
  active_model: "historical_mean"  # historical_mean | holt_winters | seasonal_naive
  baseline_seasonal_naive:
    enabled: true
    lag: 12
    description: "Último valor observado en el mismo mes del año anterior"
  baseline_historical_mean:
    enabled: true
    description: "Promedio histórico mensual calculado solo con Train"
  holt_winters:
    enabled: true
    seasonal_periods: 12
    trend: "add"
    seasonal: "add"
    damped_trend: false
    use_boxcox: false
    # clip_negative_for_evaluation: false → no recortar antes de MAE/RMSE
    clip_negative_for_evaluation: false
    description: "Holt-Winters aditivo; dominio ≥0 solo al materializar salida aprobada"

quality_thresholds:
  critical_checks:
    require_all_passed: true
  methodological_tolerance_pct: 0.02
  methodological_fail_on_discrepancy: true
  context_sources_critical: false
  metrics_acceptance:
    # Umbral inicial exigido por la guía; no ajustar post-hoc tras ver resultados
    max_mae_tolerance: 150000.0
    max_rmse_tolerance: 180000.0
    enforce_rmse_tolerance: true
    require_better_than_baseline: false
    # En evaluación se permiten negativos para no sesgar el error; la publicación los recorta a ≥0
    permit_negative_forecasts_in_evaluation: true
    round_predictions_decimals: 2

monitoring:
  # Cobertura declarada de la entrega de datos vigente (no es "hoy"). Las fuentes
  # deben llegar a este mes; las salidas deben llegar a temporal_split.eval_end.
  # Actualizar solo cuando llegue una nueva entrega institucional.
  expected_coverage_end: "2026-06-01"
  expected_monthly_frequency: "MS"
  # Variación intermensual (mes t contra mes t-1 de la misma serie). Justificación:
  # en el Total observado 2009-2019, el p95 de |variación intermensual| fue 32.4 %
  # y solo 2 de 131 meses superaron 50 %. Una variación >50 % es alerta de revisión,
  # no prueba de pérdida de precisión. Alternativa configurable: "interanual".
  variation_comparison: "intermensual"
  max_relative_variation_alert: 0.50
  quality:
    max_null_rate: 0.0            # proporción de filas con nulos en columnas clave
    max_duplicate_rate: 0.0       # proporción de claves duplicadas
    min_coverage_ratio: 1.0       # meses presentes / meses esperados entre min y max
    # Comparación con la ejecución previa (si existe su JSON de monitoreo)
    max_row_drop_ratio_vs_previous: 0.0
    max_null_rate_increase_vs_previous: 0.0
    max_duplicate_rate_increase_vs_previous: 0.0
  retention_versions_count: 5

mlflow:
  experiment_name: "Observatorio_Turismo_Guatemala"
  # Estrategia única:
  # - Local: SQLite en mlflow_store/mlflow.db y artefactos en mlflow_store/artifacts
  #   (UI local: mlflow ui --backend-store-uri sqlite:///mlflow_store/mlflow.db).
  # - Docker Compose: MLFLOW_TRACKING_URI=http://mlflow:5000 (variable de entorno)
  #   tiene prioridad sobre este valor; el servidor guarda SQLite y artefactos en
  #   el volumen persistente /mlflow.
  tracking_uri: "sqlite:///mlflow_store/mlflow.db"
  artifact_location: "mlflow_store/artifacts"
  # Reintentos de conectividad antes de iniciar; sin MLflow no se publica.
  connect_retries: 5
  connect_retry_delay_seconds: 3
